<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مساعد عيادة الابتسامة</title>
<style>
  body { margin:0; font-family:Tahoma, Arial, sans-serif; background:#eef6f8; display:flex; justify-content:center; }
  .app { width:100%; max-width:520px; height:100vh; display:flex; flex-direction:column; background:#fff; }
  header { background:#0e7c86; color:#fff; padding:16px; text-align:center; }
  header h1 { margin:0; font-size:20px; }
  header p { margin:4px 0 0; font-size:13px; opacity:.85; }
  #chat { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:80%; padding:10px 14px; border-radius:14px; line-height:1.6; white-space:pre-wrap; }
  .user { align-self:flex-start; background:#0e7c86; color:#fff; }
  .bot { align-self:flex-end; background:#f0f2f4; color:#222; }
  form { display:flex; gap:8px; padding:12px; border-top:1px solid #ddd; }
  input { flex:1; padding:12px; border:1px solid #ccc; border-radius:10px; font-size:15px; }
  button { background:#0e7c86; color:#fff; border:0; border-radius:10px; padding:0 18px; font-size:15px; cursor:pointer; }
  button:disabled { opacity:.5; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>🦷 عيادة الابتسامة</h1>
    <p>المساعد الذكي - يعمل داخل العيادة بدون إنترنت 🔒</p>
  </header>
  <div id="chat"></div>
  <form id="form">
    <input id="input" placeholder="اكتب سؤالك هنا..." autocomplete="off">
    <button id="btn">إرسال</button>
  </form>
</div>

<script>
  const chat = document.getElementById("chat");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const btn = document.getElementById("btn");
  const history = [];
  let key = null;

  function addMessage(text, who) {
    const div = document.createElement("div");
    div.className = "msg " + who;
    div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  addMessage("أهلاً! أنا مساعد عيادة الابتسامة. اسألني عن الأسعار أو المواعيد 🦷", "bot");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const question = input.value.trim();
    if (!question) return;

    if (!key) key = prompt("🔒 اكتب كلمة السر:");

    addMessage(question, "user");
    input.value = "";
    btn.disabled = true;
    history.push({ role: "user", content: question });
    const waiting = addMessage("يكتب...", "bot");

    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-API-Key": key },
        body: JSON.stringify({ model: "clinic", messages: history, stream: false })
      });

      if (res.status === 401) {
        waiting.textContent = "🔒 كلمة السر غلط! جرب مرة ثانية.";
        key = null;
        history.pop();
      } else {
        const data = await res.json();
        waiting.textContent = data.message.content;
        history.push({ role: "assistant", content: data.message.content });
      }
    } catch (err) {
      waiting.textContent = "⚠️ ما قدرت أوصل للمساعد. تأكد إن الحارس و ollama serve شغالين.";
    }

    btn.disabled = false;
    input.focus();
  });
</script>
</body>
</html>
